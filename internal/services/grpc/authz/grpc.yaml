# Capabilities held by tenant API tokens; a token may call a procedure if any capability it holds grants it.
# Tokens stored without capabilities (every token that existed before capabilities) resolve to "all".
capabilities:
  all:
    procedures: ["*"]

  # everything a worker process does, including spawning children and registering its workflows
  worker:
    inherits: [workflows:write, runs:trigger, runs:read, streams:publish, traces:export]
    procedures:
      - /Dispatcher/GetVersion
      - /Dispatcher/Register
      - /Dispatcher/Listen
      - /Dispatcher/ListenV2
      - /Dispatcher/Heartbeat
      - /Dispatcher/Unsubscribe
      - /Dispatcher/SendStepActionEvent
      - /Dispatcher/SendBatchActionEvent
      - /Dispatcher/SendGroupKeyActionEvent
      - /Dispatcher/PutOverridesData
      - /Dispatcher/RefreshTimeout
      - /Dispatcher/ReleaseSlot
      - /Dispatcher/RestoreEvictedTask
      - /Dispatcher/UpsertWorkerLabels
      - /v1.V1Dispatcher/DurableTask
      - /v1.V1Dispatcher/RegisterDurableEvent
      - /v1.V1Dispatcher/ListenForDurableEvent
      - /EventsService/PutLog
      - /EventsService/PutStreamEvent

  operator:
    procedures:
      - /v1.OperatorService/Register
      - /v1.OperatorService/Listen
      - /v1.OperatorService/SendStepActionEvent
      - /v1.OperatorService/DurableTask

  workflows:write:
    procedures:
      - /WorkflowService/PutWorkflow
      - /v1.AdminService/PutWorkflow

  runs:read:
    procedures:
      - /Dispatcher/SubscribeToWorkflowEvents
      - /Dispatcher/SubscribeToWorkflowRuns
      - /v1.AdminService/GetRunDetails

  runs:trigger:
    procedures:
      - /WorkflowService/TriggerWorkflow
      - /WorkflowService/BulkTriggerWorkflow
      - /v1.AdminService/TriggerWorkflowRun

  runs:manage:
    procedures:
      - /v1.AdminService/CancelTasks
      - /v1.AdminService/ReplayTasks
      - /v1.AdminService/BranchDurableTask

  schedules:write:
    procedures:
      - /WorkflowService/ScheduleWorkflow

  events:push:
    procedures:
      - /EventsService/Push
      - /EventsService/BulkPush

  events:manage:
    procedures:
      - /EventsService/ReplaySingleEvent

  rate-limits:write:
    procedures:
      - /WorkflowService/PutRateLimit
      - /WorkflowService/PauseRateLimit

  streams:read:
    procedures:
      - /v1.V1Streams/Subscribe
      - /v1.V1Streams/GetTopicMetadata

  streams:publish:
    procedures:
      - /v1.V1Streams/Publish
      - /v1.V1Streams/PublishBatch

  streams:manage:
    procedures:
      - /v1.V1Streams/Reset

  traces:export:
    procedures:
      - /opentelemetry.proto.collector.trace.v1.TraceService/Export
