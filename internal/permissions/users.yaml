# Roles for users; API tokens are authorized by their capabilities in tokens.yaml.
roles:
  # users who have not verified their email are capped to these operations on top of their own role
  UNVERIFIED_EMAIL:
    permissions:
      - UserGetCurrent
      - UserUpdateLogout
  OWNER:
    assignable: true
    label: "Owner"
    description: "Everything an admin can do, and invite or promote other owners."
    inherits: [ADMIN]
  NOAUTH:
    inherits: [MEMBER]
  ADMIN:
    assignable: true
    label: "Admin"
    description: "Everything a member can do, and manage members, invites, API tokens, and Labs features."
    inherits: [MEMBER]
    permissions:
      - TenantEntitlementsUpdate
      - TenantMemberUpdate
      - ApiTokenCreate
      - ApiTokenUpdateRevoke
      - TenantInviteList
      - TenantInviteCreate
      - TenantMemberList
      - TenantInviteUpdate
      - TenantInviteDelete
  MEMBER:
    assignable: true
    label: "Member"
    description: "Trigger, cancel, and replay runs, and change workflows, workers, and tenant settings."
    inherits: [VIEWER]
    permissions:
      - ApiTokenList
      - StepRunUpdateCancel
      - TenantUpdate
      - WorkflowRunUpdateReplay
      - WorkflowScheduledBulkUpdate
      - SnsCreate
      - V1TaskCancel
      - V1StreamPayloadUpload
      - V1WebhookDelete
      - V1WebhookUpdate
      - CronWorkflowTriggerCreate
      - WorkerUpdate
      - WorkflowRunCreate
      - EventCreateBulk
      - ScheduledWorkflowRunCreate
      - AlertEmailGroupCreate
      - SnsDelete
      - RateLimitDelete
      - EventUpdateCancel
      - TenantCreate
      - WebhookCreate
      - V1WorkflowRunCreate
      - SnsUpdate
      - EventUpdateReplay
      - V1DurableTaskBranch
      - V1WebhookCreate
      - V1FilterCreate
      - WorkflowScheduledBulkDelete
      - V1FilterDelete
      - V1FilterUpdate
      - SlackWebhookDelete
      - UserUpdateSlackOauthStart
      - UserUpdateSlackOauthCallback
      - TenantMemberDelete
      - WorkflowScheduledDelete
      - WorkflowScheduledUpdate
      - WorkflowUpdate
      - WorkflowDelete
      - V1TaskReplay
      - V1TaskRestore
      - WorkflowRunCancel
      - WebhookDelete
      - AlertEmailGroupUpdate
      - AlertEmailGroupDelete
      - EventCreate
      - StepRunUpdateRerun
      - WorkflowCronDelete
      - WorkflowCronUpdate
      - WorkflowCronTrigger
      - WorkflowScheduledTrigger
      - V1FilterUpdate
      - V1ServerlessEndpointCreate
      - V1ServerlessEndpointUpdate
      - V1ServerlessEndpointDelete
  VIEWER:
    assignable: true
    label: "Viewer"
    description: "View runs, workflows, events, workers, and tenant settings."
    permissions:
      - TenantRoleList
      - ApiTokenCapabilityList
      - TenantAlertingSettingsGet
      - V1EventGet
      - TenantGet
      - MetadataListIntegrations
      - SnsList
      - WorkflowScheduledList
      - WorkflowRunList
      - ReadinessGet
      - TenantInviteReject
      - V1LogLineList
      - V1StreamPayloadGet
      - V1StreamTopicList
      - V1WebhookGet
      - V1ServerlessEndpointList
      - V1ServerlessEndpointGet
      - V1ServerlessEndpointEventList
      - V1WebhookReceive
      - V1WorkflowRunList
      - V1EventKeyList
      - V1WorkflowRunExternalIdsList
      - V1WorkflowRunCountGet
      - V1WorkflowRunTaskEventsList
      - WebhookRequestsList
      - UserCreate
      - TenantGetTaskStats
      - CronWorkflowList
      - WorkflowList
      - WorkerList
      - V1WorkflowRunGetStatus
      - WorkerGet
      - WorkflowGetMetrics
      - TenantGetQueueMetrics
      - StepRunListArchives
      - WorkflowRunGet
      - V1TaskListStatusMetrics
      - AlertEmailGroupList
      - TenantInviteAccept
      - UserUpdatePassword
