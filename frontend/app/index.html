<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hatchet</title>
    <meta
      name="description"
      content="Durable workflows, AI agents and background tasks."
    />
    <link
      href="https://fonts.googleapis.com/css?family=Ubuntu:400,500,700"
      rel="stylesheet"
    />
    <!--
      Social cards for link previews. The images live in public/social/ and
      are referenced root-relative so each deployment (Hatchet Cloud or a
      self-hosted install) serves its own copy. Crawlers cache previews by
      URL, so a changed image needs a new file name to be picked up.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hatchet" />
    <meta
      property="og:description"
      content="Durable workflows, AI agents and background tasks."
    />
    <meta property="og:image" content="/social/og-image-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Hatchet: durable workflows, AI agents and background tasks."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@hatchet_dev" />
    <meta name="twitter:title" content="Hatchet" />
    <meta
      name="twitter:description"
      content="Durable workflows, AI agents and background tasks."
    />
    <meta name="twitter:image" content="/social/twitter-card-1200x600.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hatchet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
