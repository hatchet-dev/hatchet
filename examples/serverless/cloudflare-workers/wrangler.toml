# Hatchet serverless endpoint on Cloudflare Workers.
#
# name, main and compatibility_date are the three required keys
# (https://developers.cloudflare.com/workers/wrangler/configuration/).
name = "hatchet-serverless-example"
main = "src/index.ts"

# Any date up to today; pins the Workers runtime behaviour this code was written against.
compatibility_date = "2025-09-01"

# The secrets are NOT configured here. Set them as Worker secrets so they never land in
# source control:
#
#   wrangler secret put HATCHET_SIGNING_SECRET   # the HMAC key; the endpoint's signingSecret in Hatchet
#   wrangler secret put HATCHET_CLIENT_TOKEN     # a tenant API token; the tasks' Hatchet client
#
# Under `wrangler dev` both come from .dev.vars, with HATCHET_CLIENT_SERVER_URL for a local
# engine over plain HTTP (see README.md).

[limits]
# CPU time per invocation, in milliseconds. The default on the Workers Paid plan is 30 s; the
# maximum is 300000 (5 minutes) and it requires the Paid plan with the Standard usage model.
# Durable tasks spend their waits evicted (not burning CPU), so this is a ceiling for the
# work the task itself does, not for how long a run lasts.
cpu_ms = 300000

[observability]
# Lets `wrangler tail` and the dashboard show console.log output from the Worker.
enabled = true
