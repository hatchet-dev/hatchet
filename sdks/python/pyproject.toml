[project]
name = "hatchet-sdk"
version = "2.0.0a7"
description = "This is the official Python SDK for Hatchet, a distributed, fault-tolerant task queue. The SDK allows you to easily integrate Hatchet's task scheduling and workflow orchestration capabilities into your Python applications."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4"

authors = [
    { name = "Alexander Belanger", email = "alexander@hatchet.run" },
    { name = "Matt Kaye", email = "matt@hatchet.run" },
    { name = "Gabe Ruttner", email = "gabe@hatchet.run" },
    { name = "Mohammed Nafees", email = "nafees@hatchet.run" },
]

dependencies = [
    "grpcio>=1.76.0,<2",
    "grpcio-status>=1.76.0,<2",
    "protobuf>=6.30.2,<8",
    "pydantic>=2.6.3,<3",
    "python-dateutil>=2.9.0.post0,<3",
    "aiohttp>=3.10.5,<4",
    "tenacity>=8.4.1",
    "prometheus-client>=0.21.1",
    "pydantic-settings>=2.7.1,<3",
    "typing-inspection>=0.1.0",
    "urllib3>=2.6.0,<3",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.28.0,<2",
    "opentelemetry-sdk>=1.28.0,<2",
    "opentelemetry-instrumentation>=0.49b0",
    "opentelemetry-distro>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0,<2",
]

lint = [
    "mypy==2.1.0",
    "pyright[nodejs]==1.1.414",
    "ty==0.0.106",
    "types-protobuf>=5.28.3.20241030",
    "black==26.3.1",
    "click>=8.4.2",
    "types-psutil>=7.2.2.20260518",
    "ruff==0.15.10",
    "types-requests>=2.33.0.20260712",
    "psutil>=6.0.0",
    "types-grpcio>=1.83.0.20260730",
    "types-grpcio-status (>=1.0.0.20260408,<2.0.0.0)",
]

test = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.7.0",
    "pytest-retry>=1.7.0",
    "psycopg[pool]>=3.3.4,<4",
    "pytest-xdist>=3.7.0",
    "requests>=2.34.2,<3",
    "boto3[s3]>=1.43.62",
    "botocore>=1.43.67",
]

docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocstrings[python]>=1.0.6,<2",
    "griffe-pydantic>=1.3.1,<2",
    "pydoclint>=0.9.1",
    "markdownify>=1.2.3",
    "bs4>=0.0.2",
    "types-beautifulsoup4>=4.12.0.20250204",
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.52.1,<1",
]

claude = ["claude-agent-sdk", "mcp"]
openai = ["openai-agents"]

[project.entry-points."mkdocs.plugins"]
"markdown-export" = "docs.generator.markdown_export:MarkdownExportPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hatchet_sdk"]

[tool.hatch.build]
include = ["hatchet_sdk/py.typed"]


[tool.pytest.ini_options]
log_cli = true
env = ["HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED=True"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.black]
extend_exclude = "(hatchet_sdk/contracts/|hatchet_sdk/v0/contracts/|site)"

[tool.poetry]

[tool.mypy]
files = ["."]
exclude = [
    "hatchet_sdk/clients/rest/api/*",
    "hatchet_sdk/clients/rest/models/*",
    "hatchet_sdk/contracts",
    "hatchet_sdk/clients/rest/api_client.py",
    "hatchet_sdk/clients/rest/configuration.py",
    "hatchet_sdk/clients/rest/exceptions.py",
    "hatchet_sdk/clients/rest/rest.py",
    "hatchet_sdk/v0/*",
    "site/*",
    "examples/dependency_injection/dependency_annotations312.py",
]
strict = true
enable_error_code = [
    "possibly-undefined",
    "truthy-bool",
    "redundant-expr",
    "truthy-iterable",
    "unused-awaitable",
    "ignore-without-code",
]

[tool.pyright]
exclude = [
    "**/.*",
    "**/__pycache__",
    "hatchet_sdk/clients/rest/__init__.py",
    "hatchet_sdk/clients/rest/api",
    "hatchet_sdk/clients/rest/models",
    "hatchet_sdk/contracts",
    "hatchet_sdk/clients/rest/api_client.py",
    "hatchet_sdk/clients/rest/configuration.py",
    "hatchet_sdk/clients/rest/exceptions.py",
    "hatchet_sdk/clients/rest/rest.py",
    "hatchet_sdk/v0",
    "site",
    "examples/dependency_injection/dependency_annotations312.py",
]
typeCheckingMode = "strict"
# the SDK deliberately reaches into its own `_` attributes across modules
reportPrivateUsage = false
reportUninitializedInstanceVariable = "error"
reportMatchNotExhaustive = "error"
executionEnvironments = [
    # tests and examples intentionally exercise deprecated APIs
    { root = "tests", extraPaths = ["."], reportDeprecated = false },
    { root = "examples", extraPaths = ["."], reportDeprecated = false },
    { root = "." },
]

[tool.ty.src]
exclude = [
    "hatchet_sdk/clients/rest/api",
    "hatchet_sdk/clients/rest/models",
    "hatchet_sdk/contracts",
    "hatchet_sdk/clients/rest/api_client.py",
    "hatchet_sdk/clients/rest/configuration.py",
    "hatchet_sdk/clients/rest/exceptions.py",
    "hatchet_sdk/clients/rest/rest.py",
    "hatchet_sdk/v0",
    "site",
    "examples/dependency_injection/dependency_annotations312.py",
]

[tool.ty.rules]
# mypy owns `type: ignore` hygiene via `warn_unused_ignores`; some ignores are only needed by mypy
unused-type-ignore-comment = "ignore"
unsound-assignment = "error"
unsound-return = "error"

[[tool.ty.overrides]]
include = ["examples/**", "tests/**"]

[tool.ty.overrides.rules]
# tests and examples intentionally exercise deprecated APIs
deprecated = "ignore"

[tool.ruff]
target-version = "py311"
exclude = [
    "hatchet_sdk/clients/rest/api/*",
    "hatchet_sdk/clients/rest/models/*",
    "hatchet_sdk/contracts",
    "hatchet_sdk/clients/rest/api_client.py",
    "hatchet_sdk/clients/rest/configuration.py",
    "hatchet_sdk/clients/rest/exceptions.py",
    "hatchet_sdk/clients/rest/rest.py",
    "hatchet_sdk/v0/*",
    "site/*",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "ASYNC",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RET",
    "ARG",
    "G",
    "RUF",
    "DTZ",
    "FIX",
    "PERF",
    "T201",
    "TCH",
    "PT",
    "PGH",
    "ANN",
    "ERA",
]
ignore = ["E501", "RET503", "FIX", "B008", "PGH004"]
exclude = [
    "hatchet_sdk/clients/rest/api/*",
    "hatchet_sdk/clients/rest/models/*",
    "hatchet_sdk/contracts",
    "hatchet_sdk/clients/rest/api_client.py",
    "hatchet_sdk/clients/rest/configuration.py",
    "hatchet_sdk/clients/rest/exceptions.py",
    "hatchet_sdk/clients/rest/rest.py",
    "hatchet_sdk/clients/rest/api_response.py",
    "hatchet_sdk/v0/*",
    "apply_patches.py",
    "site/*",
    "examples/dependency_injection/dependency_annotations312.py",
]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are requested as arguments without being used, and examples print their results
"tests/**" = ["ARG001", "ARG002", "ANN401", "T201", "ASYNC109"]
"examples/**" = ["ARG001", "ARG002", "ANN401", "T201", "ASYNC109"]
"docs/**" = ["T201"]
# these examples block the event loop on purpose, to demonstrate the problem
"examples/blocked_async/**" = ["ASYNC251"]
"examples/blocked_loop_blog/**" = ["ASYNC251"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
exempt-modules = ["typing", "builtins"]

[tool.pydoclint]
style = "sphinx"
exclude = "v0|clients/rest/*|contracts/*|.venv|site/*|examples/dependency_injection/dependency_annotations312.py"
arg-type-hints-in-docstring = false
check-return-types = false

[dependency-groups]
test = ["pytest-timeout (>=2.4.0,<3.0.0)"]
