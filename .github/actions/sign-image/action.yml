name: Sign image
description: Keyless cosign signature on a pushed image plus a syft SPDX SBOM attestation on each of its platform manifests
inputs:
  images:
    description: Pushed image references, one per line
    required: true
  sbom:
    description: Attach an SBOM attestation to every platform manifest
    default: "true"
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - if: inputs.sbom == 'true'
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
    - shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        SBOM: ${{ inputs.sbom }}
      run: |
        set -euo pipefail
        while read -r image; do
          [ -n "$image" ] || continue
          repo=${image%%@*}; repo=${repo%:*}
          manifest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}')
          digest=$(jq -r .digest <<<"$manifest")
          cosign sign --yes --recursive "$repo@$digest"
          [ "$SBOM" = true ] || continue
          jq -r 'if .manifests then .manifests[] | select(.platform.os != "unknown") | .digest else .digest end' <<<"$manifest" |
          while read -r d; do
            syft "registry:$repo@$d" -o "spdx-json=$RUNNER_TEMP/sbom.spdx.json"
            cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$repo@$d"
          done
        done <<<"$IMAGES"
