body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > This form is for **first-time contributors** who need to be vouched before opening pull requests. Please read the [Contributing Guide](https://github.com/hatchet-dev/hatchet/blob/main/CONTRIBUTING.md) and the [AI Usage Policy](https://github.com/hatchet-dev/hatchet/blob/main/AI_POLICY.md) first.
        >
        > Keep it **short** and write it **in your own voice**. Do not have an AI write this for you. A maintainer will comment `!vouch` if your request is approved.
  - type: textarea
    attributes:
      label: What do you want to change?
      description: |
        Describe the first change you'd like to make. Small and focused is best. Link the issue or discussion if one exists.
      placeholder: |
        I'd like to fix the bug in #1234 where...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why?
      description: |
        Why does this change matter to you? How do you use Hatchet?
      placeholder: |
        We run Hatchet in production and hit this when...
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: "I acknowledge that:"
      options:
        - label: >-
            I have read the [Contributing Guide](https://github.com/hatchet-dev/hatchet/blob/main/CONTRIBUTING.md)
            and understand that new contributors start with small pull requests.
          required: true
        - label: >-
            I have read and agree to follow the
            [AI Usage Policy](https://github.com/hatchet-dev/hatchet/blob/main/AI_POLICY.md).
          required: true
        - label: >-
            I wrote this request myself, in my own voice, without AI generating it.
          required: true
