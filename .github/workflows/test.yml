            fi

            sleep 2
          done

          if ! (echo > /dev/tcp/127.0.0.1/7070) >/dev/null 2>&1 || ! (echo > /dev/tcp/127.0.0.1/8080) >/dev/null 2>&1; then
            echo "Timed out waiting for Hatchet engine/API to become ready"
            echo "=== Engine logs ==="
            cat /tmp/hatchet-engine.log
            echo "=== API logs ==="
            cat /tmp/hatchet-api.log
            exit 1
          fi

      - name: Generate API token
        run: |
          echo "HATCHET_CLIENT_TOKEN=$(go run ./cmd/hatchet-admin token create --config ./generated/ --tenant-id 707d0855-80ab-4e1f-a156-f1c4546cbf52)" >> $GITHUB_ENV
          echo "HATCHET_CLIENT_TLS_STRATEGY=none" >> $GITHUB_ENV

      - name: Test
        run: |
          go test -tags e2e ./... -p 1 -failfast

      - name: Teardown
        run: docker compose down

  load:
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        optimistic-scheduling: ["true", "false"]
        race: ["true", "false"]
    env:
      TESTING_MATRIX_MIGRATE: latest
      TESTING_MATRIX_RABBITMQ_ENABLED: "true"
      TESTING_MATRIX_PG_VERSION: 17-alpine
      TESTING_MATRIX_OPTIMISTIC_SCHEDULING: ${{ matrix.optimistic-scheduling }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1
          run_install: false

      - name: Go deps
        run: go mod download

      - name: Add go-deadlock dependency
        run: go get github.com/sasha-s/go-deadlock@v0.3.6

      - name: Patch sync.Mutex/RWMutex to use go-deadlock
        shell: bash
        run: |
          set -euo pipefail

          # Find only files that actually use sync.Mutex or sync.RWMutex.
          grep -rl --include='*.go' -E 'sync\.(RW)?Mutex' . | grep -v '/vendor/' > /tmp/mutex_files.txt || true

          if [ ! -s /tmp/mutex_files.txt ]; then
            echo "No files with sync.Mutex or sync.RWMutex found"
            exit 0
          fi

          echo "Patching $(wc -l < /tmp/mutex_files.txt) file(s):"
          cat /tmp/mutex_files.txt

          while IFS= read -r f; do
            # Rewrite type references. RWMutex first so its 'Mutex' suffix isn't clobbered.
            sed -i'' -E \
              -e 's/sync\.RWMutex/deadlocksync.RWMutex/g' \
              -e 's/sync\.Mutex/deadlocksync.Mutex/g' \
              "$f"

            # \bsync\. won't match inside "deadlocksync.", so this correctly detects
            # remaining usages of other sync primitives (WaitGroup, Once, Map, etc.).
            if grep -qE '\bsync\.' "$f"; then
              # File still needs the sync package; insert deadlocksync import alongside it.
              awk '
                /^\t"sync"$/ { print; print "\tdeadlocksync \"github.com/sasha-s/go-deadlock\""; next }
                { print }
              ' "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
            else
              # sync package no longer needed; replace its import with the deadlocksync alias.
              sed -i'' \
                -e 's|^\t"sync"$|\tdeadlocksync "github.com/sasha-s/go-deadlock"|' \
                -e 's|^import "sync"$|import deadlocksync "github.com/sasha-s/go-deadlock"|' \
                "$f"
            fi
          done < /tmp/mutex_files.txt

          xargs gofmt -w < /tmp/mutex_files.txt

          echo "Changed Go files (after patch):"
          git diff --name-only -- '*.go' || true

      - name: Start CPU sampler
        run: hack/ci/cpu-sampler.sh start "$RUNNER_TEMP/cpu-samples.log"

      - name: Start pprof sampler
        run: hack/ci/pprof-sampler.sh start "$RUNNER_TEMP/pprof" localhost:6060

      - name: Start pg_stat sampler
        run: hack/ci/pgstat-sampler.sh start "$RUNNER_TEMP/pgstat" "postgres:$TESTING_MATRIX_PG_VERSION"

      - name: Test
        id: run-tests
        run: |
          # Disable gzip compression for load tests to reduce CPU overhead
          # Compression adds overhead without benefit for 0kb payloads
          HATCHET_CLIENT_DISABLE_GZIP_COMPRESSION=true go test -tags load ./... -p 5 ${{ matrix.race == 'true' && '-race' || '' }} -failfast -timeout 20m
        env:
          HATCHET_LOADTEST_STARTUP_SLEEP: 120s
          HATCHET_LOADTEST_PPROF_ADDR: localhost:6060
          # With the race detector the run checks correctness only, so the
          # latency gate is effectively off. Without it, runners have still
          # measured 4x to 6x slower than the 40ms to 65ms baseline on steal
          # alone, so the gate stays at 1s until that settles.
          HATCHET_LOADTEST_AVERAGE_DURATION_THRESHOLD: ${{ matrix.race == 'true' && '1h' || '1s' }}

      - name: CPU sampler summary
        if: always()
        run: |
          hack/ci/cpu-sampler.sh stop "$RUNNER_TEMP/cpu-samples.log"
          hack/ci/cpu-sampler.sh summarize "$RUNNER_TEMP/cpu-samples.log"

      - name: pprof summary
        if: always()
        run: |
          hack/ci/pprof-sampler.sh stop "$RUNNER_TEMP/pprof"
          hack/ci/pprof-sampler.sh summarize "$RUNNER_TEMP/pprof" | tee "$RUNNER_TEMP/pprof/summary.txt"

      - name: pg_stat summary
        if: always()
        run: |
          hack/ci/pgstat-sampler.sh stop "$RUNNER_TEMP/pgstat"
          hack/ci/pgstat-sampler.sh summarize "$RUNNER_TEMP/pgstat" | tee "$RUNNER_TEMP/pgstat/summary.txt"

      - name: Record the failure for the report job
        if: failure() && steps.run-tests.outcome == 'failure'
        run: echo "load (optimistic ${{ matrix.optimistic-scheduling }}, race ${{ matrix.race }})" > "$RUNNER_TEMP/failed-leg.txt"

      - name: Upload CPU samples and profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-samples-optimistic-${{ matrix.optimistic-scheduling }}-race-${{ matrix.race }}
          path: |
            ${{ runner.temp }}/cpu-samples.log
            ${{ runner.temp }}/pprof/
            ${{ runner.temp }}/pgstat/
            ${{ runner.temp }}/failed-leg.txt
          if-no-files-found: warn

  # Posts the performance comment for failed load legs. It runs in its own
  # job so the token that can write to pull requests never shares a process
  # with the tests, and only for pull requests opened from a branch in this
  # repository by an owner, member or collaborator. The reporter and the
  # workflow steps below come from the pull request's base commit, not from
  # the pull request, so the code that handles the token is the reviewed one.
  load-report:
    needs: load
    if: always() && needs.load.result == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Download load samples
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: load-samples-*
          path: ${{ runner.temp }}/load-samples

      - name: Comment performance metrics on PR
        run: |
          posted=0
          for dir in "$RUNNER_TEMP"/load-samples/*/; do
            [ -f "$dir/failed-leg.txt" ] || continue
            label="$(head -c 120 "$dir/failed-leg.txt" | tr -d '\n')"
            go run ./hack/ci/loadreport \
              -cpu "$dir/cpu-samples.log" \
              -pprof "$dir/pprof/summary.txt" \
              -pgstat "$dir/pgstat/summary.txt" \
              -label "$label" \
              -repository "${{ github.repository }}" \
              -run-id "${{ github.run_id }}" \
              > "$RUNNER_TEMP/performance-comment.md" || continue
            gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/performance-comment.md"
            posted=$((posted + 1))
          done
          echo "posted $posted comment(s)"
        env:
          GH_TOKEN: ${{ github.token }}
