name: test
on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "sdks/typescript/**"
      - "sdks/python/**"
      - "frontend/**"
      - "examples/**"

jobs:
  generate:
    runs-on: ubicloud-standard-4
    env:
      DATABASE_URL: postgresql://hatchet:hatchet@127.0.0.1:5431/hatchet?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "29.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1
          run_install: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.3.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2"

      - name: Start embedded Postgres
        uses: ./.github/actions/hatchet-embedded
        with:
          pg-only: "true"

      - name: Generate
        run: |
          go run ./cmd/hatchet-migrate
          task pre-commit-install
          task generate-all

      - name: Check for diff
        run: git diff --exit-code

  unit:
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Cache embedded Postgres binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-unit-${{ hashFiles('go.sum') }}
          restore-keys: |
            embedded-postgres-${{ runner.os }}-

      - name: Go deps
        run: go mod download

      - name: Generate
        run: go generate ./...

      - name: Test
        run: go test $(go list ./... | grep -v "quickstart") -v -failfast

  integration:
    runs-on: ubicloud-standard-8
    env:
      DATABASE_URL: postgresql://hatchet:hatchet@127.0.0.1:5431/hatchet?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1
          run_install: false

      - name: Compose
        run: docker compose up -d rabbitmq nats

      - name: Start embedded Postgres
        uses: ./.github/actions/hatchet-embedded
        with:
          pg-only: "true"

      - name: Go deps
        run: go mod download

      - name: Generate
        run: |
          go run ./cmd/hatchet-migrate
          task generate-certs
          task generate-local-encryption-keys

      - name: Test
        run: go test -tags integration $(go list ./... | grep -v "quickstart") -v -failfast

      - name: Teardown
        run: docker compose down

  e2e:
    runs-on: ubicloud-standard-8
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Compose
        run: docker compose up -d --wait rabbitmq

      - name: Go deps
        run: go mod download

      - name: Start Hatchet embedded
        uses: ./.github/actions/hatchet-embedded
        with:
          rabbitmq-url: amqp://user:password@127.0.0.1:5672/

      - name: Test
        run: |
          go test -tags e2e ./... -p 1 -v -failfast

      - name: Show engine logs on failure
        if: failure()
        run: cat embedded.log || true

      - name: Teardown
        run: docker compose down

  e2e-pgmq:
    runs-on: ubicloud-standard-8
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Go deps
        run: go mod download

      - name: Start Hatchet embedded
        uses: ./.github/actions/hatchet-embedded
        env:
          SERVER_TASKQUEUE_KIND: postgres

      - name: Test
        run: |
          go test -tags e2e ./... -p 1 -v -failfast

      - name: Show engine logs on failure
        if: failure()
        run: cat embedded.log || true

  load:
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    strategy:
      matrix:
        migrate-strategy: ["latest"]
        rabbitmq-enabled: ["true"]
        pg-version: ["17"]
        optimistic-scheduling: ["true", "false"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1
          run_install: false

      - name: Cache embedded Postgres binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-load-${{ hashFiles('go.sum') }}
          restore-keys: |
            embedded-postgres-${{ runner.os }}-

      - name: Go deps
        run: go mod download

      - name: Test
        run: |
          # Disable gzip compression for load tests to reduce CPU overhead
          # Compression adds overhead without benefit for 0kb payloads
          HATCHET_CLIENT_DISABLE_GZIP_COMPRESSION=true go test -tags load ./... -p 5 -v -race -failfast -timeout 20m
        env:
          TESTING_MATRIX_MIGRATE: ${{ matrix.migrate-strategy }}
          TESTING_MATRIX_RABBITMQ_ENABLED: ${{ matrix.rabbitmq-enabled }}
          TESTING_MATRIX_PG_VERSION: ${{ matrix.pg-version }}
          TESTING_MATRIX_OPTIMISTIC_SCHEDULING: ${{ matrix.optimistic-scheduling }}
          HATCHET_LOADTEST_STARTUP_SLEEP: 120s

  load-deadlock:
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      matrix:
        migrate-strategy: ["latest"]
        rabbitmq-enabled: ["true"]
        pg-version: ["17"]
        optimistic-scheduling: ["true", "false"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1
          run_install: false

      - name: Cache embedded Postgres binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-load-${{ hashFiles('go.sum') }}
          restore-keys: |
            embedded-postgres-${{ runner.os }}-

      - name: Go deps
        run: go mod download

      - name: Add go-deadlock dependency
        run: go get github.com/sasha-s/go-deadlock@v0.3.6

      - name: Patch sync.Mutex/RWMutex to use go-deadlock
        shell: bash
        run: |
          set -euo pipefail

          # Find only files that actually use sync.Mutex or sync.RWMutex.
          grep -rl --include='*.go' -E 'sync\.(RW)?Mutex' . | grep -v '/vendor/' > /tmp/mutex_files.txt || true

          if [ ! -s /tmp/mutex_files.txt ]; then
            echo "No files with sync.Mutex or sync.RWMutex found"
            exit 0
          fi

          echo "Patching $(wc -l < /tmp/mutex_files.txt) file(s):"
          cat /tmp/mutex_files.txt

          while IFS= read -r f; do
            # Rewrite type references. RWMutex first so its 'Mutex' suffix isn't clobbered.
            sed -i'' -E \
              -e 's/sync\.RWMutex/deadlocksync.RWMutex/g' \
              -e 's/sync\.Mutex/deadlocksync.Mutex/g' \
              "$f"

            # \bsync\. won't match inside "deadlocksync.", so this correctly detects
            # remaining usages of other sync primitives (WaitGroup, Once, Map, etc.).
            if grep -qE '\bsync\.' "$f"; then
              # File still needs the sync package; insert deadlocksync import alongside it.
              awk '
                /^\t"sync"$/ { print; print "\tdeadlocksync \"github.com/sasha-s/go-deadlock\""; next }
                { print }
              ' "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
            else
              # sync package no longer needed; replace its import with the deadlocksync alias.
              sed -i'' \
                -e 's|^\t"sync"$|\tdeadlocksync "github.com/sasha-s/go-deadlock"|' \
                -e 's|^import "sync"$|import deadlocksync "github.com/sasha-s/go-deadlock"|' \
                "$f"
            fi
          done < /tmp/mutex_files.txt

          xargs gofmt -w < /tmp/mutex_files.txt

          echo "Changed Go files (after patch):"
          git diff --name-only -- '*.go' || true

      - name: Test (deadlock-instrumented)
        id: run-tests
        continue-on-error: true
        run: |
          # Disable gzip compression for load tests to reduce CPU overhead
          # Compression adds overhead without benefit for 0kb payloads
          HATCHET_CLIENT_DISABLE_GZIP_COMPRESSION=true go test -tags load ./... -p 5 -v -race -failfast -timeout 20m
        env:
          # This job adds go-deadlock + -race overhead; relax perf threshold to avoid flakes.
          HATCHET_LOADTEST_AVERAGE_DURATION_THRESHOLD: 1s
          # Give the engine a bit more time to come up under instrumentation.
          HATCHET_LOADTEST_STARTUP_SLEEP: 120s
          TESTING_MATRIX_MIGRATE: ${{ matrix.migrate-strategy }}
          TESTING_MATRIX_RABBITMQ_ENABLED: ${{ matrix.rabbitmq-enabled }}
          TESTING_MATRIX_PG_VERSION: ${{ matrix.pg-version }}
          TESTING_MATRIX_OPTIMISTIC_SCHEDULING: ${{ matrix.optimistic-scheduling }}

      - name: Comment on PR
        if: steps.run-tests.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "⚠️ **Optional test failure**: The \`load-deadlock\` job failed on this PR (optimistic-scheduling=${{ matrix.optimistic-scheduling }}). This check is non-mandatory and does not block merging, but may be worth investigating. [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        env:
          GH_TOKEN: ${{ github.token }}

  rampup:
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    strategy:
      matrix:
        migrate-strategy: ["latest"]
        rabbitmq-enabled: ["true"]
        pg-version: ["17"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1
          run_install: false

      - name: Cache embedded Postgres binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-load-${{ hashFiles('go.sum') }}
          restore-keys: |
            embedded-postgres-${{ runner.os }}-

      - name: Go deps
        run: go mod download

      - name: Test
        run: |
          go test -tags rampup ./... -p 5 -v -race -failfast -timeout 20m
        env:
          TESTING_MATRIX_MIGRATE: ${{ matrix.migrate-strategy }}
          TESTING_MATRIX_RABBITMQ_ENABLED: ${{ matrix.rabbitmq-enabled }}
          TESTING_MATRIX_PG_VERSION: ${{ matrix.pg-version }}
          RAMP_UP_DURATION_TIMEOUT: 30s
