name: "frontend / docs"
on:
  pull_request:
    paths:
      - 'frontend/docs/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/docs/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend/docs
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - name: Generate snippets
        working-directory: frontend/snippets
        run: python3 generate.py
      - name: Lint
        working-directory: frontend/docs
        run: pnpm run lint:check

  search-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/docs/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend/docs
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - name: Generate snippets
        working-directory: frontend/snippets
        run: python3 generate.py
      - name: Generate search index
        working-directory: frontend/docs
        run: pnpm run generate-llms
      - name: Run search quality tests
        working-directory: frontend/docs
        run: pnpm run test-search

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/docs/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend/docs
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - name: Generate snippets
        working-directory: frontend/snippets
        run: python3 generate.py
      - name: Build
        working-directory: frontend/docs
        run: pnpm run build
      - name: Start server
        working-directory: frontend/docs
        run: |
          pnpm run start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/v1 > /dev/null && break; sleep 1; done
      - name: Check for broken links
        uses: step-security/linkinator-action@c5c14e450dc690abba177d09df1ace749b4fd45c # v1.11.2
        with:
          paths: http://localhost:3000
          recurse: true
          skip: "^(?!http://localhost:3000)"
          verbosity: ERROR
