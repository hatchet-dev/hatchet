name: load-online-migrate
on:
  push:
    branches:
      - main
    paths:
      - "cmd/hatchet-migrate/migrate/migrations/**"
  pull_request:
    paths:
      - "cmd/hatchet-migrate/migrate/migrations/**"

jobs:
  load-online-migrate:
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      DATABASE_URL: postgresql://hatchet:hatchet@127.0.0.1:5431/hatchet?sslmode=disable
      SERVER_GRPC_PORT: "7077"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_SECURITY_CHECK_ENABLED: "false"
      SERVER_GRPC_INSECURE: "true"
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "true"
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_LOGGER_LEVEL: warn
      SERVER_LOGGER_FORMAT: console
      DATABASE_LOGGER_LEVEL: warn
      DATABASE_LOGGER_FORMAT: console

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Hold back only this branch's new goose files. Seed and boot against the
      # PR base schema (usually main / prod), then apply branch migrations online.
      - name: Resolve base migration version
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="${{ github.event.repository.default_branch }}"
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          BASE_MIGRATION_VERSION=$(git ls-tree -r --name-only "origin/${BASE_REF}" -- cmd/hatchet-migrate/migrate/migrations/ \
            | xargs -n1 basename \
            | grep -E '^[0-9]+' \
            | sort \
            | tail -1 \
            | cut -d'_' -f1)
          if [ -z "$BASE_MIGRATION_VERSION" ]; then
            echo "could not determine latest migration on origin/${BASE_REF}"
            exit 1
          fi
          echo "Base migration version (origin/${BASE_REF}): $BASE_MIGRATION_VERSION"
          echo "BASE_MIGRATION_VERSION=$BASE_MIGRATION_VERSION" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Compose
        run: docker compose up -d

      - name: Run migrations up to base
        run: go run ./cmd/hatchet-migrate --up-to ${{ env.BASE_MIGRATION_VERSION }}

      - name: Setup config and seed database
        run: |
          mkdir -p generated
          go run ./cmd/hatchet-admin quickstart --skip certs --generated-config-dir ./generated

      - name: Generate API token
        run: |
          TOKEN=$(go run ./cmd/hatchet-admin --config ./generated token create)
          echo "HATCHET_CLIENT_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Start engine
        run: |
          go run ./cmd/hatchet-engine --config ./generated > /tmp/engine.log 2>&1 &
          ENGINE_PID=$!
          echo $ENGINE_PID > /tmp/engine.pid

          echo "Waiting for engine gRPC port 7077..."
          for _ in {1..60}; do
            if ! kill -0 "$ENGINE_PID" 2>/dev/null; then
              echo "Engine exited before becoming ready:"
              tail -50 /tmp/engine.log
              exit 1
            fi

            if nc -z localhost 7077; then
              echo "Engine is accepting connections on port 7077"
              exit 0
            fi

            sleep 1
          done

          echo "Timed out waiting for engine gRPC port 7077"
          tail -50 /tmp/engine.log
          exit 1

      - name: Run load test with migrations
        id: run-load-test
        continue-on-error: true
        run: |
          HATCHET_CLIENT_TOKEN="${{ env.HATCHET_CLIENT_TOKEN }}" \
          HATCHET_CLIENT_TLS_STRATEGY=none \
          HATCHET_CLIENT_HOST_PORT=localhost:7077 \
          go run ./cmd/hatchet-loadtest loadtest -e 10 -d 240s -w 60s -s 100 \
            --registrationTimeout 20s > /tmp/loadtest.log 2>&1 &
          LOADTEST_PID=$!
          echo $LOADTEST_PID > /tmp/loadtest.pid

          (
            while kill -0 "$LOADTEST_PID" 2>/dev/null; do
              ENGINE_PID=$(cat /tmp/engine.pid)
              if ! kill -0 "$ENGINE_PID" 2>/dev/null; then
                echo "Engine died during load test:"
                tail -50 /tmp/engine.log
                kill "$LOADTEST_PID" 2>/dev/null || true
                exit 1
              fi
              sleep 5
            done
          ) &
          WATCHER=$!

          echo "Waiting 30s for load test to get started..."
          # Keep this above the 20s registration timeout so PutWorkflow must succeed on the base (main) schema.
          sleep 30

          echo "Applying branch migrations..."
          go run ./cmd/hatchet-migrate
          echo "Branch migrations applied"

          echo "Migrating down to base version ${{ env.BASE_MIGRATION_VERSION }}..."
          go run ./cmd/hatchet-migrate --down ${{ env.BASE_MIGRATION_VERSION }}
          echo "Down migration successful"

          echo "Re-applying migrations..."
          go run ./cmd/hatchet-migrate
          echo "Re-migration successful"

          echo "Waiting for load test to complete..."
          set +e
          wait $LOADTEST_PID
          LOADTEST_RC=$?
          set -e

          kill "$WATCHER" 2>/dev/null || true
          wait "$WATCHER" 2>/dev/null || true

          if [ "$LOADTEST_RC" -ne 0 ]; then
            echo "=== Load test logs ==="
            cat /tmp/loadtest.log
            echo "=== Engine logs ==="
            cat /tmp/engine.log
            exit "$LOADTEST_RC"
          fi
          echo "Load test passed"

      - name: Upload load-online-migrate logs
        if: steps.run-load-test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-online-migrate-logs
          path: |
            /tmp/engine.log
            /tmp/loadtest.log
          if-no-files-found: ignore

      - name: Comment on PR
        if: steps.run-load-test.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "⚠️ **Optional test failure**: The \`load-online-migrate\` job failed on this PR. This check is non-mandatory and does not block merging, but may be worth investigating. [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Teardown
        if: always()
        run: |
          if [ -f /tmp/loadtest.pid ]; then kill $(cat /tmp/loadtest.pid) 2>/dev/null || true; fi
          if [ -f /tmp/engine.pid ]; then kill $(cat /tmp/engine.pid) 2>/dev/null || true; fi
          docker compose down
