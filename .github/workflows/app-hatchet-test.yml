name: "frontend / app on hatchet"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: hatchet
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/app/pnpm-lock.yaml
      - name: Install Python
        if: runner.environment == 'self-hosted'
        run: sudo apt-get update -q && sudo apt-get install -y -q python3
      - name: Install dependencies
        working-directory: frontend/app
        run: sh "${GITHUB_WORKSPACE:?}/hack/ci/retry.sh" pnpm install --frozen-lockfile
      - name: Generate docs snippets and examples
        working-directory: frontend/snippets
        run: python3 generate.py
      - name: Build
        working-directory: frontend/app
        run: npm run build
