name: build
on:
  pull_request:
    paths-ignore:
      - "sdks/**"
      - "frontend/docs/**"
      - "frontend/**/generated/**"
      - "examples/**"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Generate docs snippets and examples
        working-directory: frontend/snippets
        run: python3 generate.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.16.1
          run_install: false
      - name: Install frontend dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        working-directory: frontend/app
        run: pnpm run test:unit
      - name: Build frontend
        run: docker build -f ./build/package/frontend.dockerfile .

  api:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build servers
        run: docker build -f ./build/package/servers.dockerfile . --build-arg SERVER_TARGET=api

  api-arm:
    runs-on: hatchet-arm64-2
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build servers
        run: docker build -f ./build/package/servers.dockerfile . --build-arg SERVER_TARGET=api

  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build servers
        run: docker build -f ./build/package/servers.dockerfile . --build-arg SERVER_TARGET=engine

  engine-arm:
    runs-on: hatchet-arm64-2
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build servers
        run: docker build -f ./build/package/servers.dockerfile . --build-arg SERVER_TARGET=engine

  authdisabled:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build api (authdisabled)
        run: docker build -f ./build/package/servers.dockerfile . --build-arg SERVER_TARGET=api --build-arg GO_BUILD_TAGS=authdisabled
      - name: Build engine (authdisabled)
        run: docker build -f ./build/package/servers.dockerfile . --build-arg SERVER_TARGET=engine --build-arg GO_BUILD_TAGS=authdisabled
      - name: Build admin (authdisabled)
        run: docker build -f ./build/package/servers.dockerfile . --build-arg SERVER_TARGET=admin --build-arg GO_BUILD_TAGS=authdisabled
      - name: Build lite (authdisabled)
        run: docker build -f ./build/package/servers.dockerfile . --build-arg SERVER_TARGET=lite --build-arg GO_BUILD_TAGS=authdisabled
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Generate docs snippets and examples
        working-directory: frontend/snippets
        run: python3 generate.py
      - name: Build dashboard (authdisabled)
        run: |
          DOCKER_BUILDKIT=1 docker build -f ./build/package/servers.dockerfile \
            --build-arg SERVER_TARGET=api --build-arg GO_BUILD_TAGS=authdisabled \
            -t hatchet-api-dev-tmp .
          DOCKER_BUILDKIT=1 docker build -f ./build/package/dashboard.dockerfile \
            --build-arg HATCHET_API_IMAGE=hatchet-api-dev-tmp .

  fips:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Generate docs snippets and examples
        working-directory: frontend/snippets
        run: python3 generate.py
      - name: Build servers (fips)
        run: |
          for target in api engine admin migrate lite; do
            DOCKER_BUILDKIT=1 docker build -f ./build/package/servers.dockerfile \
              --build-arg SERVER_TARGET=$target --build-arg FIPS=true \
              -t hatchet-$target-fips-tmp . &
          done
          wait
      - name: Build lite, dashboard and frontend (fips)
        run: |
          DOCKER_BUILDKIT=1 docker build -f ./build/package/lite.dockerfile \
            --build-arg HATCHET_LITE_IMAGE=hatchet-lite-fips-tmp \
            --build-arg HATCHET_ADMIN_IMAGE=hatchet-admin-fips-tmp \
            --build-arg HATCHET_MIGRATE_IMAGE=hatchet-migrate-fips-tmp \
            -t hatchet-lite-fips:ci .
          DOCKER_BUILDKIT=1 docker build -f ./build/package/dashboard.dockerfile \
            --build-arg HATCHET_API_IMAGE=hatchet-api-fips-tmp --build-arg FIPS=true \
            -t hatchet-dashboard-fips:ci .
          DOCKER_BUILDKIT=1 docker build -f ./build/package/frontend.dockerfile \
            --build-arg FIPS=true -t hatchet-frontend-fips:ci .
      - name: Assert every Go binary links the validated FIPS module
        run: |
          EXPECT_FIPS=true bash hack/ci/assert-fips.sh \
            hatchet-api-fips-tmp=/hatchet/hatchet-api \
            hatchet-engine-fips-tmp=/hatchet/hatchet-engine \
            hatchet-admin-fips-tmp=/hatchet/hatchet-admin \
            hatchet-migrate-fips-tmp=/hatchet/hatchet-migrate \
            hatchet-lite-fips:ci=/hatchet-lite,/hatchet-admin,/hatchet-migrate \
            hatchet-dashboard-fips:ci=/hatchet/hatchet-api,/hatchet/hatchet-staticfileserver \
            hatchet-frontend-fips:ci=/app/hatchet-staticfileserver

  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build servers
        run: docker build -f ./build/package/servers.dockerfile . --build-arg SERVER_TARGET=admin

  admin-arm:
    runs-on: hatchet-arm64-2
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build servers
        run: docker build -f ./build/package/servers.dockerfile . --build-arg SERVER_TARGET=admin

  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build migrate
        run: docker build -f ./build/package/servers.dockerfile . --build-arg SERVER_TARGET=migrate

  migrate-arm:
    runs-on: hatchet-arm64-2
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build migrate
        run: docker build -f ./build/package/servers.dockerfile . --build-arg SERVER_TARGET=migrate

  lite-arm:
    runs-on: hatchet-arm64-2
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Generate docs snippets and examples
        working-directory: frontend/snippets
        run: python3 generate.py
      - name: Build lite
        run: |
          DOCKER_BUILDKIT=1 docker build -f ./build/package/servers.dockerfile \
            --build-arg SERVER_TARGET=lite \
            --platform linux/arm64 \
            -t hatchet-lite-tmp:arm64 \
            . &

          DOCKER_BUILDKIT=1 docker build -f ./build/package/servers.dockerfile \
            --build-arg SERVER_TARGET=admin \
            --platform linux/arm64 \
            -t hatchet-admin-tmp:arm64 \
            . &

          DOCKER_BUILDKIT=1 docker build -f ./build/package/servers.dockerfile \
            --build-arg SERVER_TARGET=migrate \
            --platform linux/arm64 \
            -t hatchet-migrate-tmp:arm64 \
            . &

          wait

          DOCKER_BUILDKIT=1 docker build -f ./build/package/lite.dockerfile \
            --build-arg HATCHET_LITE_IMAGE=hatchet-lite-tmp:arm64 \
            --build-arg HATCHET_ADMIN_IMAGE=hatchet-admin-tmp:arm64 \
            --build-arg HATCHET_MIGRATE_IMAGE=hatchet-migrate-tmp:arm64 \
            --platform linux/arm64 \
            .

  lite-amd:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Generate docs snippets and examples
        working-directory: frontend/snippets
        run: python3 generate.py
      - name: Build lite
        run: |
          DOCKER_BUILDKIT=1 docker build -f ./build/package/servers.dockerfile \
            --build-arg SERVER_TARGET=lite \
            --platform linux/amd64 \
            -t hatchet-lite-tmp:amd64 \
            . &

          DOCKER_BUILDKIT=1 docker build -f ./build/package/servers.dockerfile \
            --build-arg SERVER_TARGET=admin \
            --platform linux/amd64 \
            -t hatchet-admin-tmp:amd64 \
            . &

          DOCKER_BUILDKIT=1 docker build -f ./build/package/servers.dockerfile \
            --build-arg SERVER_TARGET=migrate \
            --platform linux/amd64 \
            -t hatchet-migrate-tmp:amd64 \
            . &

          wait

          DOCKER_BUILDKIT=1 docker build -f ./build/package/lite.dockerfile \
            --build-arg HATCHET_LITE_IMAGE=hatchet-lite-tmp:amd64 \
            --build-arg HATCHET_ADMIN_IMAGE=hatchet-admin-tmp:amd64 \
            --build-arg HATCHET_MIGRATE_IMAGE=hatchet-migrate-tmp:amd64 \
            --platform linux/amd64 \
            .

  dashboard-arm:
    runs-on: hatchet-arm64-2
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Generate docs snippets and examples
        working-directory: frontend/snippets
        run: python3 generate.py
      - name: Build dashboard
        run: |
          DOCKER_BUILDKIT=1 docker build -f ./build/package/servers.dockerfile \
            --build-arg SERVER_TARGET=api \
            --platform linux/arm64 \
            -t hatchet-api-tmp:arm64 \
            .

          DOCKER_BUILDKIT=1 docker build -f ./build/package/dashboard.dockerfile \
            --build-arg HATCHET_API_IMAGE=hatchet-api-tmp:arm64 \
            --platform linux/arm64 \
            .

  dashboard-amd:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Generate docs snippets and examples
        working-directory: frontend/snippets
        run: python3 generate.py
      - name: Build dashboard
        run: |
          DOCKER_BUILDKIT=1 docker build -f ./build/package/servers.dockerfile \
            --build-arg SERVER_TARGET=api \
            --platform linux/amd64 \
            -t hatchet-api-tmp:amd64 \
            .

          DOCKER_BUILDKIT=1 docker build -f ./build/package/dashboard.dockerfile \
            --build-arg HATCHET_API_IMAGE=hatchet-api-tmp:amd64 \
            --platform linux/amd64 \
            .

  loadtest:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build loadtest
        run: docker build -f ./build/package/loadtest.dockerfile .

  loadtest-arm:
    runs-on: hatchet-arm64-2
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build loadtest
        run: docker build -f ./build/package/loadtest.dockerfile .
