name: python
on:
  pull_request:
    paths:
      - ".github/**"
      - "api/**"
      - "api-contracts/**"
      - "internal/**"
      - "pkg/**"
      - "sdks/python/**"
  push:
    branches:
      - main
    paths:
      - "sdks/python/**"

defaults:
  run:
    working-directory: ./sdks/python

jobs:
  lint:
    runs-on: ubicloud-standard-4
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.3.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install linting tools
        run: poetry install --all-extras

      - name: Run Black
        run: poetry run black . --check --verbose --diff --color

      - name: Run MyPy
        run: poetry run mypy --config-file=pyproject.toml

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Run Pydoclint
        run: poetry run pydoclint .

      - name: Setup Go
        if: matrix.python-version == '3.14'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Generate protobuf & REST client bindings
        if: matrix.python-version == '3.14'
        run: ./generate.sh

      - name: Check generated bindings are up to date
        if: matrix.python-version == '3.14'
        run: |
          git add -A hatchet_sdk/contracts hatchet_sdk/clients/rest
          if ! git diff --cached --exit-code -- hatchet_sdk/contracts hatchet_sdk/clients/rest; then
            echo "::error::Generated protobuf/REST bindings are out of date. Run 'sdks/python/generate.sh' and commit the changes."
            exit 1
          fi

      - name: Test install
        run: pip install -e .

  test:
    runs-on: ubicloud-standard-4
    strategy:
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.14"]') || fromJSON('["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
        concurrency-in-memory-index: ["true", "false"]
        dag-operator: ["true", "false"]
        exclude:
          # the dag operator is independent of the concurrency index, so only vary it on one side
          - concurrency-in-memory-index: "false"
            dag-operator: "true"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "25.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Start Hatchet embedded
        uses: ./.github/actions/hatchet-embedded
        with:
          log-file: engine.log
        env:
          SERVER_CONCURRENCY_IN_MEMORY_INDEX_ENABLED: ${{ matrix.concurrency-in-memory-index }}
          SERVER_OBSERVABILITY_ENABLED: "true"

      - name: Set DAG operator entitlement
        working-directory: .
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenant_entitlement (tenant_id)
          SELECT id
          FROM "Tenant"
          ON CONFLICT (tenant_id) DO NOTHING;

          UPDATE tenant_entitlement
          SET dag_operator = ${{ matrix.dag-operator }};
          SQL

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.3.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --all-extras

      - name: Generate Env File
        working-directory: .
        run: |
          echo "HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED=True" >> $GITHUB_ENV

      - name: Set HATCHET_CLIENT_NAMESPACE
        run: |
          PYTHON_VERSION=$(python -c "import sys; print(f'py{sys.version_info.major}{sys.version_info.minor}')")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "HATCHET_CLIENT_NAMESPACE=${PYTHON_VERSION}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Run pytest
        run: |
          echo "Using HATCHET_CLIENT_NAMESPACE: $HATCHET_CLIENT_NAMESPACE"
          poetry run pytest -s -vvv --maxfail=5 --capture=no --retries 3 --retry-delay 2 -n 8 --timeout 180

      - name: Test with wheel
        run: |
          poetry build
          poetry run pip uninstall hatchet_sdk -y
          poetry run pip install --no-cache-dir --no-index --find-links dist/  hatchet_sdk -v
          poetry run python -c "from hatchet_sdk import Workflow;"

      - name: Upload engine logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.HATCHET_CLIENT_NAMESPACE }}-cimi-${{ matrix.concurrency-in-memory-index }}-dag-${{ matrix.dag-operator }}-engine-logs
          path: engine.log

  publish:
    runs-on: ubicloud-standard-4
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install Poetry
        run: |
          pipx install poetry==2.3.0

      - name: Run publish.sh script
        run: |
          CURRENT_PYPI_VERSION=$(pip index versions hatchet-sdk | awk 'NR==1 {gsub(/[()]/,"",$2); print $2}')
          NEW_VERSION=$(cat pyproject.toml| grep "^version =" | cut -d '"' -f 2)

          if [ "$CURRENT_PYPI_VERSION" == "$NEW_VERSION" ]; then
            echo "Version has not changed. Skipping publish."
            exit 0
          fi

          sh publish.sh
          echo "VERSION_TAG=$NEW_VERSION" >> $GITHUB_ENV
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.POETRY_PYPI_TOKEN_PYPI }}

      - name: "Generate release notes"
        if: env.VERSION_TAG != ''
        working-directory: ${{ github.workspace }}
        run: ./hack/ci/release-notes.sh python > ./release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Release"
        if: env.VERSION_TAG != ''
        working-directory: ${{ github.workspace }}
        run: |
          gh release create "py/${VERSION_TAG}" \
            --target "$GITHUB_SHA" \
            --title "Python SDK ${VERSION_TAG}" \
            --notes-file ./release_notes.md \
            --latest=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
