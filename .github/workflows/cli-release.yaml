name: Release Hatchet CLI

on:
  push:
    tags:
      - "v*" # Trigger on version tags like v0.73.10
      - "!v*-alpha*" # Do not trigger for alpha releases
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.89.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release-cli:
    name: Release CLI with GoReleaser
    runs-on: ubuntu-latest
    needs: [verify, generate-changelog]
    env:
      GITHUB_TAG: ${{ inputs.tag || github.ref_name }}
    if: needs.verify.outputs.should_release == 'true'
    steps:
      - name: Update CA certificates
        # Runner images predate Ubuntu's ca-certificates fix for the compromised eMudhra CAs (USN-8944-1); drop this step once they ship 20260816ubuntu0.* or later.
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 install -y --only-upgrade ca-certificates
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          dpkg --compare-versions "$v" ge 20260816 || { echo "::error::ca-certificates $v predates USN-8944-1"; exit 1; }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Checkout the release tag
        run: git checkout "$GITHUB_TAG"

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: true
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1

      - name: Set up Python (docs snippet generation for the embedded UI)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install quill (for macOS code signing)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/quill/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install syft (for SBOM generation)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --release-notes=${{ runner.temp }}/release_notes.md --clean --draft
          workdir: cmd/hatchet-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.verify.outputs.prev_tag }}
          # Homebrew tap token
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # macOS signing and notarization secrets
          # These should be set as repository secrets in GitHub
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dist
          # GoReleaser runs with workdir cmd/hatchet-cli, so dist is not at the repo root.
          path: cmd/hatchet-cli/dist/
          retention-days: 7

  verify:
    name: Verify Release Tag
    runs-on: ubuntu-latest
    env:
      GITHUB_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      # We should only be triggering a release when using an annotated tag type.
      should_release: ${{ steps.tag_name.outputs.tag_type == 'tag' }}
      prev_tag: ${{ steps.prev.outputs.prev_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the tag object
        run: git fetch --force origin tag "$GITHUB_TAG"

      - name: Check if tag is annotated
        id: tag_name
        run: |
          tag_type=$(git cat-file -t "$GITHUB_TAG")
          echo "Tag [$GITHUB_TAG] is of type [$tag_type]."
          echo "tag_type=$tag_type" >> $GITHUB_OUTPUT

      - name: Determine previous release tag
        id: prev
        run: |
          PREV_TAG=$(gh release view --json tagName --jq .tagName)
          echo "Previous release tag: $PREV_TAG"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-changelog:
    name: Generate release_notes.md artifact
    runs-on: ubuntu-latest
    needs: [verify]
    if: needs.verify.outputs.should_release == 'true'
    env:
      GITHUB_TAG: ${{ inputs.tag || github.ref_name }}
      PREV_TAG: ${{ needs.verify.outputs.prev_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the tag object
        run: git fetch --force origin tag "$GITHUB_TAG"

      - name: Generate release section
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: ${{ env.PREV_TAG }}..${{ env.GITHUB_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: /tmp/CHANGES.md

      - name: Generate release notes
        run: |
          ./hack/ci/release-notes-cli.sh "$GITHUB_TAG" > release_notes.md
          echo "" >> release_notes.md
          cat /tmp/CHANGES.md >> release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release_notes.md
          overwrite: true
          retention-days: 1

  npm-publish:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    needs: [verify, release-cli]
    if: needs.verify.outputs.should_release == 'true'
    # Name must match the trusted publisher environment on each @hatchet-dev/cli* package.
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: true
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Drop the setup-node auth token
        # An empty _authToken makes npm try token auth and skip trusted publishing.
        run: |
          npmrc="${HOME}/.npmrc"
          if [ -f "$npmrc" ]; then
            grep -v '_authToken' "$npmrc" > "${npmrc}.tmp" || true
            mv "${npmrc}.tmp" "$npmrc"
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: cli-dist

      - name: Assemble npm packages
        run: node cmd/hatchet-cli/npm/build.mjs "${GITHUB_TAG#v}" cli-dist cmd/hatchet-cli/npm/npm-out

      - name: Publish npm packages
        run: |
          unset NODE_AUTH_TOKEN
          VERSION="${GITHUB_TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi

          publish() {
            local dir="$1"
            local name
            name="$(node -p "require('./${dir}/package.json').name")"
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${name}@${VERSION} is already published; skipping"
              return
            fi
            npm publish --access public --provenance --tag "$DIST_TAG" "$dir"
          }

          shopt -s nullglob
          platform_dirs=(cmd/hatchet-cli/npm/npm-out/cli-*)
          if [ "${#platform_dirs[@]}" -eq 0 ]; then
            echo "no platform packages to publish" >&2
            exit 1
          fi
          for dir in "${platform_dirs[@]}"; do
            publish "$dir"
          done
          publish cmd/hatchet-cli/npm/npm-out/cli
