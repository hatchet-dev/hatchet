name: Release Hatchet CLI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.89.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  GITHUB_TAG: ${{ inputs.tag }}

jobs:
  release-cli:
    name: Release CLI with GoReleaser
    runs-on: ubuntu-latest
    needs: [verify, generate-changelog]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Checkout the release tag
        run: git checkout "$GITHUB_TAG"

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true

      - name: Install quill (for macOS code signing)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/quill/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install syft (for SBOM generation)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --release-notes=${{ runner.temp }}/release_notes.md --clean --draft
          workdir: cmd/hatchet-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.verify.outputs.prev_tag }}
          # Homebrew tap token
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # macOS signing and notarization secrets
          # These should be set as repository secrets in GitHub
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dist
          path: dist/
          retention-days: 7

  verify:
    name: Verify Release Tag
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      prev_tag: ${{ steps.prev.outputs.prev_tag }}
    steps:
      - name: Check the tag is a release version
        run: |
          if [[ ! "$GITHUB_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_TAG is not a release tag. Expected vMAJOR.MINOR.PATCH with no pre-release suffix (e.g. v0.89.0)."
            exit 1
          fi

      - name: Check the tag exists
        run: |
          if ! gh api "repos/{owner}/{repo}/git/ref/tags/$GITHUB_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $GITHUB_TAG does not exist. Push the tag before running this workflow."
            exit 1
          fi
          echo "Tag [$GITHUB_TAG] exists."

      - name: Check no release exists for the tag
        run: |
          if gh release view "$GITHUB_TAG" >/dev/null 2>&1; then
            echo "::error::A release for $GITHUB_TAG already exists (this includes drafts)."
            exit 1
          fi
          echo "No existing release for [$GITHUB_TAG]."

      - name: Determine previous release tag
        id: prev
        run: |
          PREV_TAG=$(gh release view --json tagName --jq .tagName)
          echo "Previous release tag: $PREV_TAG"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

  generate-changelog:
    name: Generate release_notes.md artifact
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Generate release section
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: ${{ needs.verify.outputs.prev_tag }}..${{ inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: /tmp/CHANGES.md

      - name: Generate release notes
        run: |
          ./hack/ci/release-notes-cli.sh "$GITHUB_TAG" > release_notes.md
          echo "" >> release_notes.md
          cat /tmp/CHANGES.md >> release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release_notes.md
          overwrite: true
          retention-days: 1
