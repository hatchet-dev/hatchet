name: sdk reference docs

on:
  push:
    branches: [main]
    paths:
      - "sdks/**"
  pull_request:
    paths:
      - "sdks/**"

jobs:
  check-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1
          run_install: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: "3.2"

      - name: Regenerate SDK references
        run: |
          cd frontend/docs && pnpm install && cd ../..
          task generate-sdk-reference -v

      - name: Check for drift
        run: |
          DIRS="frontend/docs/pages/reference/python frontend/docs/pages/reference/typescript frontend/docs/pages/reference/ruby frontend/docs/pages/reference/go"

          if [ -n "$(git status --porcelain -- $DIRS)" ]; then
            echo "SDK reference docs are out of date with the SDK source:"
            git status --porcelain -- $DIRS
            git diff -- $DIRS | head -200
            echo ""
            echo "Run 'task generate-sdk-reference' and commit the result."
            exit 1
          fi
          echo "SDK reference docs are up to date."

  generate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.16.1
          run_install: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: "3.2"

      - name: Generate SDK reference docs
        run: |
          cd frontend/docs && pnpm install && cd ../..
          task generate-sdk-reference -v

      - name: Check for changes in reference docs
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- frontend/docs/pages/reference/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create branch and commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          BRANCH_NAME="regenerate-sdk-reference-${{ github.sha }}"
          git checkout -b "$BRANCH_NAME"
          git add frontend/docs/pages/reference/
          git commit -m "chore: regenerate sdk reference docs"
          git push origin "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        id: create-branch

      - name: Close existing sdk reference PRs
        if: steps.verify-changed-files.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PRS=$(gh pr list --label "autogenerated-docs" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("regenerate-sdk-reference-")) | .number')

          for pr in $EXISTING_PRS; do
            if [ -n "$pr" ]; then
              echo "Closing existing sdk reference PR #$pr"
              gh pr close $pr --comment "Closing in favor of newer sdk reference PR"
            fi
          done

      - name: Create Pull Request
        if: steps.verify-changed-files.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore: regenerate sdk reference docs" \
            --body "Automated regeneration of SDK reference docs from the main branch." \
            --head "${{ steps.create-branch.outputs.branch_name }}" \
            --base main \
            --label "autogenerated-docs"
        id: create-pr

      - name: Request review from triggering author
        if: steps.verify-changed-files.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHOR="${{ github.actor }}"

          if [ "$AUTHOR" != "github-actions[bot]" ]; then
            gh pr edit "${{ steps.create-branch.outputs.branch_name }}" --add-reviewer "$AUTHOR" || {
              gh pr comment "${{ steps.create-branch.outputs.branch_name }}" --body "@$AUTHOR Please review this autogenerated PR"
            }
            echo "Requested review from $AUTHOR"
          else
            echo "Skipping review request as author is github-actions bot"
          fi
