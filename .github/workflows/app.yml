name: "frontend / app"
on:
  pull_request:
    paths:
      - "frontend/app/**"
      - "frontend/docs/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.34.9
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend/app
        run: sh "${GITHUB_WORKSPACE:?}/hack/ci/retry.sh" pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend/app
        run: npm run lint:check
      - name: Check for unused dependencies and files
        working-directory: frontend/app
        run: pnpm run knip

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.34.9
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend/app
        run: sh "${GITHUB_WORKSPACE:?}/hack/ci/retry.sh" pnpm install --frozen-lockfile
      - name: Run unit tests
        working-directory: frontend/app
        run: pnpm run test:unit

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.34.9
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend/app
        run: sh "${GITHUB_WORKSPACE:?}/hack/ci/retry.sh" pnpm install --frozen-lockfile
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Generate docs snippets and examples
        working-directory: frontend/snippets
        run: python3 generate.py
      - name: Build
        working-directory: frontend/app
        run: npm run build
  e2e-seeded:
    runs-on: ubicloud-standard-4
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.34.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/app/pnpm-lock.yaml

      - name: Generate docs snippets and examples
        working-directory: frontend/app
        run: pnpm run docs:gen

      - name: Start dependencies (postgres, rabbitmq)
        run: docker compose up -d

      - name: Write E2E env
        run: bash ./hack/ci/write-e2e-env.sh

      - name: Generate encryption keys
        run: bash ./hack/dev/generate-local-encryption-keys.sh ./hack/dev/encryption-keys

      - name: Migrate DB
        run: bash ./hack/dev/migrate.sh

      - name: Seed
        run: bash ./hack/dev/run-go-with-env.sh run ./cmd/hatchet-admin seed-e2e

      - name: Install frontend deps
        working-directory: frontend/app
        run: sh "${GITHUB_WORKSPACE:?}/hack/ci/retry.sh" pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend/app
        run: sh "${GITHUB_WORKSPACE:?}/hack/ci/retry.sh" pnpm exec playwright install --with-deps chromium

      - name: Start API + engine
        run: |
          set -euo pipefail
          bash ./hack/ci/start-api.sh > api.log 2>&1 &
          bash ./hack/ci/start-engine.sh > engine.log 2>&1 &
          bash ./hack/ci/wait-for-http.sh http://127.0.0.1:8733/ready 120

      - name: Start frontend
        working-directory: frontend/app
        run: |
          set -euo pipefail
          pnpm run dev -- --host app.localtest.me --port 5173 > vite.log 2>&1 &
          bash ../../hack/ci/wait-for-http.sh http://app.localtest.me:5173 120

      - name: Run Playwright
        working-directory: frontend/app
        env:
          PLAYWRIGHT_BASE_URL: http://app.localtest.me:5173
        run: pnpm run e2e:seeded

      # Uploaded on success too so the HTML report is always available from the run summary.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-seeded
          if-no-files-found: ignore
          retention-days: 14
          path: frontend/app/playwright-report

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          if-no-files-found: ignore
          path: |
            api.log
            engine.log
            frontend/app/vite.log

  # The e2e-isolated container image must match the @playwright/test version
  # exactly, so derive its tag from the lockfile instead of pinning it twice.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: frontend/app/pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - name: Read @playwright/test version
        id: version
        run: |
          set -euo pipefail
          # `|| true` lets the format check below report a missing entry.
          version=$(grep -A2 "^      '@playwright/test':$" frontend/app/pnpm-lock.yaml | sed -n 's/^ *version: //p' || true)
          version="${version%%(*}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not read the @playwright/test version from pnpm-lock.yaml (got '$version')" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Isolated tests mock every API call, so this job needs no Go, database or
  # seed step and runs alongside e2e-seeded. The Playwright image ships the
  # browser and its system dependencies, which take minutes to install with apt.
  e2e-isolated:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    # Steps in a container default to sh (dash), which has no pipefail.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.34.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/app/pnpm-lock.yaml

      - name: Generate docs snippets and examples
        working-directory: frontend/app
        run: pnpm run docs:gen

      - name: Install frontend deps
        working-directory: frontend/app
        run: sh "${GITHUB_WORKSPACE:?}/hack/ci/retry.sh" pnpm install --frozen-lockfile

      - name: Start frontend
        working-directory: frontend/app
        run: |
          set -euo pipefail
          pnpm run dev -- --host localhost --port 5173 > vite.log 2>&1 &
          bash ../../hack/ci/wait-for-http.sh http://localhost:5173 120

      - name: Run Playwright
        working-directory: frontend/app
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: pnpm run e2e:isolated

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-isolated
          if-no-files-found: ignore
          retention-days: 14
          path: frontend/app/playwright-report

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-isolated-logs
          if-no-files-found: ignore
          path: frontend/app/vite.log
