V1ServerlessEndpointKind:
  type: string
  description: >-
    The kind of serverless endpoint. GENERIC_HTTP is any HTTPS endpoint that implements the
    serverless endpoint contract; CLOUDFLARE_WORKERS and VERCEL name the platform the endpoint
    is deployed on, which the dashboard uses to guide setup and diagnose failures.
  enum:
    - GENERIC_HTTP
    - CLOUDFLARE_WORKERS
    - VERCEL

V1ServerlessEndpointStatus:
  type: object
  description: >-
    The health of the endpoint as last observed by the serverless operator. Written on state
    transitions only, so changedAt is the time the endpoint last flipped between healthy and
    unhealthy.
  properties:
    healthy:
      type: boolean
      description: Whether the last healthcheck succeeded. Absent until the operator has polled the endpoint at least once.
    error:
      type: string
      description: The error from the last failed healthcheck, if the endpoint is unhealthy.
    changedAt:
      type: string
      format: date-time
      description: When the healthy flag last changed.
    registeredActions:
      type: array
      description: >-
        The action ids the operator registered for this endpoint from its last healthcheck,
        as the endpoint declared them. Several endpoints of a tenant may register the same
        action; each then serves it.
      items:
        type: string
  required:
    - registeredActions

V1ServerlessEndpoint:
  type: object
  properties:
    metadata:
      $ref: "../metadata.yaml#/APIResourceMeta"
    tenantId:
      type: string
      format: uuid
      description: The ID of the tenant that owns this endpoint.
    name:
      type: string
      description: The name of the endpoint. Unique within the tenant.
    kind:
      $ref: "#/V1ServerlessEndpointKind"
    healthcheckUrl:
      type: string
      description: The HTTPS URL (port 443) polled periodically to discover the workflows this endpoint serves.
    triggerUrl:
      type: string
      description: The HTTPS URL (port 443) that assigned tasks are delivered to.
    requestTimeoutSeconds:
      type: integer
      format: int32
      description: The per-request timeout backstop for trigger requests, in seconds.
    pollIntervalSeconds:
      type: integer
      format: int32
      description: How often the healthcheck URL is polled, in seconds.
    inlineWaitBudgetMs:
      type: integer
      format: int32
      description: >-
        How long a trigger request may block waiting for a durable result before the operator
        falls back to the websocket durable protocol, in milliseconds.
    labels:
      type: object
      additionalProperties: true
      description: Worker labels applied to the connection-backed worker the operator creates for this endpoint.
    enabled:
      type: boolean
      description: Whether the operator polls and dispatches to this endpoint.
    status:
      $ref: "#/V1ServerlessEndpointStatus"
  required:
    - metadata
    - tenantId
    - name
    - kind
    - healthcheckUrl
    - triggerUrl
    - requestTimeoutSeconds
    - pollIntervalSeconds
    - inlineWaitBudgetMs
    - labels
    - enabled
    - status

V1ServerlessEndpointList:
  type: object
  properties:
    pagination:
      $ref: "../metadata.yaml#/PaginationResponse"
    rows:
      type: array
      items:
        $ref: "#/V1ServerlessEndpoint"

V1CreateServerlessEndpointRequest:
  type: object
  properties:
    name:
      type: string
      description: The name of the endpoint. Unique within the tenant.
    kind:
      $ref: "#/V1ServerlessEndpointKind"
    healthcheckUrl:
      type: string
      description: The HTTPS URL (port 443) polled periodically to discover the workflows this endpoint serves.
    triggerUrl:
      type: string
      description: The HTTPS URL (port 443) that assigned tasks are delivered to.
    signingSecret:
      type: string
      minLength: 32
      description: >-
        The secret used to HMAC-sign requests delivered to the endpoint. At least 32
        characters. Write-only: it is stored encrypted and never returned in responses.
    requestTimeoutSeconds:
      type: integer
      format: int32
      description: The per-request timeout backstop for trigger requests, in seconds. Defaults to 300.
    pollIntervalSeconds:
      type: integer
      format: int32
      description: How often the healthcheck URL is polled, in seconds. Defaults to 30.
    inlineWaitBudgetMs:
      type: integer
      format: int32
      description: The inline wait budget for durable results, in milliseconds. Defaults to 5000.
    labels:
      type: object
      additionalProperties: true
      description: Worker labels applied to the worker the operator creates for this endpoint.
    enabled:
      type: boolean
      description: Whether the operator polls and dispatches to this endpoint. Defaults to true.
  required:
    - name
    - healthcheckUrl
    - triggerUrl
    - signingSecret

V1UpdateServerlessEndpointRequest:
  type: object
  description: Fields to update on a serverless endpoint. Omitted fields are left unchanged.
  properties:
    name:
      type: string
      description: The name of the endpoint. Unique within the tenant.
    kind:
      $ref: "#/V1ServerlessEndpointKind"
    healthcheckUrl:
      type: string
      description: The HTTPS URL (port 443) polled periodically to discover the workflows this endpoint serves.
    triggerUrl:
      type: string
      description: The HTTPS URL (port 443) that assigned tasks are delivered to.
    signingSecret:
      type: string
      minLength: 32
      description: >-
        A new secret used to HMAC-sign requests delivered to the endpoint. At least 32
        characters. Provide a value to rotate the secret; it is never returned in responses.
    requestTimeoutSeconds:
      type: integer
      format: int32
      description: The per-request timeout backstop for trigger requests, in seconds.
    pollIntervalSeconds:
      type: integer
      format: int32
      description: How often the healthcheck URL is polled, in seconds.
    inlineWaitBudgetMs:
      type: integer
      format: int32
      description: The inline wait budget for durable results, in milliseconds.
    labels:
      type: object
      additionalProperties: true
      description: Worker labels applied to the worker the operator creates for this endpoint. Replaces the existing labels.
    enabled:
      type: boolean
      description: Whether the operator polls and dispatches to this endpoint.

V1ServerlessEndpointCheckStage:
  type: string
  description: >-
    How far a failed healthcheck got. REQUEST: no HTTP response (DNS, TLS, connection, timeout
    or a blocked destination). STATUS: the endpoint answered with a non-2xx status. PARSE: the
    body is not a healthcheck response. CATALOG: the response parsed but the workflows or
    actions it declares were refused.
  enum:
    - REQUEST
    - STATUS
    - PARSE
    - CATALOG

V1ServerlessEndpointEventKind:
  type: string
  description: >-
    HEALTHCHECK_FAILED: a healthcheck failed; recorded at the start of a failure streak and
    whenever the error changes. UNHEALTHY: the endpoint's health flipped to unhealthy.
    HEALTHY: the endpoint's health flipped to healthy, or its healthchecks succeed again
    after a streak of failures too short to flip it. CATALOG_REGISTERED: a changed set of
    workflows and actions was registered. CATALOG_REJECTED: the engine refused the declared
    workflows. DELIVERY_FAILED: a task delivered to the endpoint failed. HEALTHCHECK_FAILED,
    CATALOG_REJECTED, DELIVERY_FAILED and HEALTHY are each recorded at most once per endpoint
    every 30 seconds, and an endpoint records at most 120 events an hour; what is held back
    is counted in details.suppressed of the next event of the same kind.
  enum:
    - HEALTHCHECK_FAILED
    - UNHEALTHY
    - HEALTHY
    - CATALOG_REGISTERED
    - CATALOG_REJECTED
    - DELIVERY_FAILED

V1ServerlessEndpointEventDetails:
  type: object
  properties:
    stage:
      $ref: "#/V1ServerlessEndpointCheckStage"
    url:
      type: string
    statusCode:
      type: integer
      format: int32
    durationMs:
      type: integer
      format: int32
    responseExcerpt:
      x-payload: true
      type: string
      description: The start of the response body, at most 1 KiB. Omitted for members who cannot view payloads.
    actions:
      type: array
      items:
        type: string
    workflows:
      type: array
      items:
        type: string
    taskRunExternalId:
      type: string
      format: uuid
    actionId:
      type: string
    retryCount:
      type: integer
      format: int32
    retryable:
      type: boolean
      description: Whether the engine will retry the failed delivery.
    suppressed:
      type: integer
      format: int32
      description: >-
        Events of this kind since the previous one that were not recorded on their own, because
        they came too soon after it or past the endpoint's event budget.
    truncated:
      type: boolean
      description: >-
        Whether the details were cut to bound the event's size: the workflows and actions lists
        keep their first 50 entries, and long names are shortened.

V1ServerlessEndpointEvent:
  type: object
  properties:
    id:
      type: integer
      format: int64
    createdAt:
      type: string
      format: date-time
    kind:
      $ref: "#/V1ServerlessEndpointEventKind"
    message:
      type: string
    details:
      $ref: "#/V1ServerlessEndpointEventDetails"
  required:
    - id
    - createdAt
    - kind
    - message
    - details

V1ServerlessEndpointEventList:
  type: object
  properties:
    rows:
      type: array
      items:
        $ref: "#/V1ServerlessEndpointEvent"
  required:
    - rows
