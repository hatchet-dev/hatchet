APIToken:
  type: object
  properties:
    metadata:
      $ref: "./metadata.yaml#/APIResourceMeta"
    name:
      type: string
      description: The name of the API token.
      maxLength: 255
    readOnly:
      type: boolean
      description: Whether the token is limited to viewer access over REST and cannot use gRPC.
    capabilities:
      type: array
      items:
        type: string
      description: The capabilities the token holds, which grant REST operations and gRPC procedures. Tokens created without capabilities hold "all", or "read-only" if they are read-only.
    expiresAt:
      type: string
      format: date-time
      description: When the API token expires.
  required:
    - metadata
    - name
    - expiresAt
    - readOnly
    - capabilities

CreateAPITokenRequest:
  type: object
  properties:
    name:
      type: string
      description: A name for the API token.
      maxLength: 255
    readOnly:
      type: boolean
      description: Limit the token to viewer access over REST and deny all gRPC calls. Defaults to false.
    capabilities:
      type: array
      items:
        type: string
      minItems: 1
      description: The capabilities that decide which REST operations and gRPC procedures the token can call, e.g. ["worker"] or ["events:push"]. Defaults to ["all"].
    expiresIn:
      type: string
      description: The duration for which the token is valid.
      x-oapi-codegen-extra-tags:
        validate: "omitnil,duration"
  required:
    - name

CreateAPITokenResponse:
  type: object
  properties:
    token:
      type: string
      description: The API token.
  required:
    - token

ListAPITokensResponse:
  properties:
    pagination:
      $ref: "./metadata.yaml#/PaginationResponse"
    rows:
      items:
        $ref: "#/APIToken"
      type: array

TokenCapability:
  type: object
  properties:
    name:
      type: string
      description: The name to pass in an API token's capabilities.
    label:
      type: string
      description: A short display name for a bundle, e.g. "Read".
    description:
      type: string
      description: What the capability lets a token do.
    group:
      type: string
      description: The section the capability is listed under.
    bundle:
      type: boolean
      description: Whether the capability only stands for the capabilities in includes.
    includes:
      type: array
      items:
        type: string
      description: The listed capabilities this one grants through inheritance, for a bundle every one it stands for.
  required:
    - name
    - description
    - bundle
    - includes

TokenCapabilityList:
  type: object
  properties:
    rows:
      type: array
      items:
        $ref: "#/TokenCapability"
  required:
    - rows

TenantRole:
  type: object
  properties:
    name:
      type: string
      description: The role's name, as a tenant member's role.
    label:
      type: string
      description: A short display name, e.g. "Admin".
    description:
      type: string
      description: What a member with the role can do.
    operations:
      type: array
      items:
        type: string
      description: The REST operations the role allows, by operation id.
  required:
    - name
    - label
    - description
    - operations

TenantRoleList:
  type: object
  properties:
    rows:
      type: array
      items:
        $ref: "#/TenantRole"
  required:
    - rows
