APIToken:
  type: object
  properties:
    metadata:
      $ref: "./metadata.yaml#/APIResourceMeta"
    name:
      type: string
      description: The name of the API token.
      maxLength: 255
    readOnly:
      type: boolean
      description: Whether the token is limited to viewer access over REST and cannot use gRPC.
    expiresAt:
      type: string
      format: date-time
      description: When the API token expires.
  required:
    - metadata
    - name
    - expiresAt
    - readOnly

CreateAPITokenRequest:
  type: object
  properties:
    name:
      type: string
      description: A name for the API token.
      maxLength: 255
    readOnly:
      type: boolean
      description: Limit the token to viewer access over REST and deny all gRPC calls. Defaults to false.
    expiresIn:
      type: string
      description: The duration for which the token is valid.
      x-oapi-codegen-extra-tags:
        validate: "omitnil,duration"
  required:
    - name

CreateAPITokenResponse:
  type: object
  properties:
    token:
      type: string
      description: The API token.
  required:
    - token

ListAPITokensResponse:
  properties:
    pagination:
      $ref: "./metadata.yaml#/PaginationResponse"
    rows:
      items:
        $ref: "#/APIToken"
      type: array
