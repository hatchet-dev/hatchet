syntax = "proto3";

option go_package = "github.com/hatchet-dev/hatchet/internal/services/shared/proto/v1";

package v1;

import "google/protobuf/timestamp.proto";

service V1Streams {
    rpc Publish(PublishStreamMessageRequest) returns (PublishStreamMessageResponse) {}
    rpc PublishBatch(PublishStreamMessagesRequest) returns (PublishStreamMessagesResponse) {}
    rpc Subscribe(SubscribeStreamRequest) returns (stream StreamMessage) {}
    rpc GetTopicMetadata(GetStreamTopicMetadataRequest) returns (StreamTopicMetadata) {}
    rpc Reset(ResetStreamTopicRequest) returns (ResetStreamTopicResponse) {}
}

message PublishStreamMessageRequest {
    string namespace = 1;
    string topic = 2;
    bytes payload = 3;
    string producer_id = 4;
    int64 producer_seq = 5;
    // instead of payload: a ref returned by the stream payload upload endpoint,
    // for payloads too large for one gRPC message
    string payload_ref = 6;
}

message PublishStreamMessageResponse {}

// one round trip for a producer's next messages to a topic, stored atomically
message PublishStreamMessagesRequest {
    string namespace = 1;
    string topic = 2;
    string producer_id = 3;
    // the first entry's sequence number; each later entry's is one more
    int64 first_producer_seq = 4;
    repeated StreamPublishEntry entries = 5;
}

message StreamPublishEntry {
    bytes payload = 1;
    // instead of payload: a ref returned by the stream payload upload endpoint
    string payload_ref = 2;
}

message PublishStreamMessagesResponse {}

message SubscribeStreamRequest {
    string namespace = 1;
    string topic = 2;
    optional string cursor = 3;
}

message StreamMessage {
    repeated StreamEntry entries = 1;
    bool hangup = 2;
    string cursor = 3;
}

message StreamEntry {
    bytes payload = 1;
    string cursor = 2;
    google.protobuf.Timestamp created_at = 3;
    // instead of payload: fetch it from the stream payload endpoint by this ref
    string payload_ref = 4;
}

message GetStreamTopicMetadataRequest {
    string namespace = 1;
    string topic = 2;
}

// Counts and the latest message cover only what's within the tenant's retention.
message StreamTopicMetadata {
    string namespace = 1;
    string topic = 2;
    string tenant_id = 3;
    // resumes a subscription after the newest retained message; unset when none is retained
    optional string latest_cursor = 4;
    int64 message_count = 5;
    // when the newest retained message was stored; unset when none is retained
    google.protobuf.Timestamp last_published_at = 6;
}

message ResetStreamTopicRequest {
    string namespace = 1;
    string topic = 2;
}

message ResetStreamTopicResponse {}
