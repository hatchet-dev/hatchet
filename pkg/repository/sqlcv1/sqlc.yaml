version: "2"
sql:
  - engine: "postgresql"
    # database:
    #   uri: "postgres://hatchet:hatchet@localhost:5431/hatchet"
    queries:
      - api_token.sql
      - concurrency.sql
      - dags.sql
      - dispatcher.sql
      - health.sql
      - tasks.sql
      - queue.sql
      - triggers.sql
      - workflows.sql
      - lease.sql
      - workers.sql
      - matches.sql
      - mq.sql
      - olap.sql
      - rate_limits.sql
      - log_line.sql
      - otel.sql
      - security_check.sql
      - slack.sql
      - sleep.sql
      - sns.sql
      - tenants.sql
      - tenant_invites.sql
      - tenant_limits.sql
      - tenant_entitlements.sql
      - ticker.sql
      - filters.sql
      - payload-store.sql
      - webhooks.sql
      - idempotency-keys.sql
      - interval_settings.sql
      - pg_health.sql
      - users.sql
      - sync.sql
      - workflow_schedules.sql
      - allocated_resources.sql
      - durable_event_log.sql
      - operator.sql
      - maintenance.sql
      - serverless.sql
      - streams.sql
    schema:
      - ../../../sql/schema/v0.sql
      - ../../../sql/schema/v1-core.sql
      - ../../../sql/schema/v1-olap.sql
      - ../../../sql/schema/pg-stubs.sql
      - ./concurrency-additional-tables.sql
    strict_order_by: false
    gen:
      go:
        package: "sqlcv1"
        sql_package: "pgx/v5"
        out: "."
        emit_exact_table_names: true
        emit_methods_with_db_argument: true
        emit_result_struct_pointers: true
        emit_json_tags: true
        emit_enum_valid_method: true
        overrides:
          - column: "v1_task.concurrency_parent_strategy_ids"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Int8"
              slice: true
          # NULL elements mean "static max_concurrency applies", so the slice type must
          # be able to represent them
          - column: "v1_task.concurrency_max_runs"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Int4"
              slice: true
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # enums shared with the API layer; hack/sqlc/extract-enums.go moves their sqlc output into pkg/enums
          - db_type: "TenantMemberRole"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "TenantMemberRole"
          - db_type: "TenantMemberRole"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullTenantMemberRole"
          - db_type: "TenantMajorEngineVersion"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "TenantMajorEngineVersion"
          - db_type: "TenantMajorEngineVersion"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullTenantMajorEngineVersion"
          - db_type: "LimitResource"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "LimitResource"
          - db_type: "LimitResource"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullLimitResource"
          - db_type: "v1_concurrency_strategy"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "V1ConcurrencyStrategy"
          - db_type: "v1_concurrency_strategy"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullV1ConcurrencyStrategy"
          - db_type: "v1_durable_event_log_kind"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "V1DurableEventLogKind"
          - db_type: "v1_durable_event_log_kind"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullV1DurableEventLogKind"
          - db_type: "v1_event_type_olap"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "V1EventTypeOlap"
          - db_type: "v1_event_type_olap"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullV1EventTypeOlap"
          - db_type: "v1_incoming_webhook_auth_type"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "V1IncomingWebhookAuthType"
          - db_type: "v1_incoming_webhook_auth_type"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullV1IncomingWebhookAuthType"
          - db_type: "v1_incoming_webhook_hmac_algorithm"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "V1IncomingWebhookHmacAlgorithm"
          - db_type: "v1_incoming_webhook_hmac_algorithm"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullV1IncomingWebhookHmacAlgorithm"
          - db_type: "v1_incoming_webhook_source_name"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "V1IncomingWebhookSourceName"
          - db_type: "v1_incoming_webhook_source_name"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullV1IncomingWebhookSourceName"
          - db_type: "v1_readable_status_olap"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "V1ReadableStatusOlap"
          - db_type: "v1_readable_status_olap"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullV1ReadableStatusOlap"
          - db_type: "v1_run_kind"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "V1RunKind"
          - db_type: "v1_run_kind"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullV1RunKind"
          - db_type: "v1_serverless_endpoint_event_kind"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "V1ServerlessEndpointEventKind"
          - db_type: "v1_serverless_endpoint_event_kind"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullV1ServerlessEndpointEventKind"
          - db_type: "v1_serverless_endpoint_kind"
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "V1ServerlessEndpointKind"
          - db_type: "v1_serverless_endpoint_kind"
            nullable: true
            go_type:
              import: "github.com/hatchet-dev/hatchet/pkg/enums"
              type: "NullV1ServerlessEndpointKind"
          - db_type: "uuidrange"
            go_type:
              type: "UUIDRange"
